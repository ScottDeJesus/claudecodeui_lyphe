# CloudCLI's screens for the house's walk library (hooks/web_walk; SEAM 3). A change that moves a screen updates this file
# in the same change. Names follow PlaceId (src/shared/types.ts) and SettingsMainTab; every target is a name, never a
# position; no entry sends a chat turn. Addresses live in the house registry (hooks/web_walk/apps.toml), never here.

[app]
theme = "light"

[screen.home]
says = "The sessions home: every chat by folder."
path = "/home"
landmark = { role = "heading", name = "Home" }

[screen.station]
says = "The station: what each running chat needs."
path = "/station"
landmark = { role = "heading", name = "Station" }

[screen.session]
says = "One chat, by its session id."
path = "/session/{session}"
needs = ["session"]
landmark = { role = "textbox" }

[screen.roadmap]
says = "The roadmap: the house's plans and their phases."
steps = [{ click = { role = "button", name = "Roadmap", in = { role = "navigation", name = "Views" } } }]
landmark = { role = "heading", name = "Roadmap" }

[screen.bugs]
says = "The bug board: filed tickets by state."
steps = [{ click = { role = "button", name = "Bugs", in = { role = "navigation", name = "Views" } } }]
landmark = { role = "heading", name = "Bugs" }

