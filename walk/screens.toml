# CloudCLI's screens for the house's walk library (hooks/web_walk; SEAM 3). A change that moves a screen updates this file
# in the same change. Names follow PlaceId (src/shared/types.ts), SettingsMainTab and the Analytics section registry; every
# target is a name, never a position; no entry sends a chat turn. The views and Settings are reached through the Places
# menu (its Menu button, then the place), which every layout draws: the Views rail is set aside while a chat holds the
# workspace. Headings are matched with exact = false, case-blind, since the app sets many in capitals by CSS. Addresses
# live in the house registry (hooks/web_walk/apps.toml), never here.

[app]
# HoopList's rows (the bug board's and the other boards'): data-hoop-row reads a row's id, data-hoop-row-state its state
# (working, ...), so {mark = "working"} or {mark = "<a ticket id>"} finds a row by name.
mark = ["data-hoop-row", "data-hoop-row-state"]
theme = "light"

[screen.home]
says = "The sessions home: every chat by folder."
path = "/home"
landmark = { role = "heading", name = "Home" }

[screen.station]
says = "The station: the companion's page, with what is in flight."
path = "/station"
landmark = { role = "slider", name = "In flight" }

[screen.session]
says = "One chat, by its session id."
path = "/session/{session}"
needs = ["session"]
landmark = { role = "button", name = "Attach a file" }

[screen.roadmap]
says = "The roadmap: the house's plans and their phases."
steps = [{ click = { role = "button", name = "Menu" } }, { click = { role = "menuitem", name = "Roadmap", in = { role = "menu", name = "Places" } } }]
landmark = { role = "heading", name = "Roadmap" }

[screen.bugs]
says = "The bug board: filed tickets by state."
steps = [{ click = { role = "button", name = "Menu" } }, { click = { role = "menuitem", name = "Bugs", in = { role = "menu", name = "Places" } } }]
landmark = { role = "tab", name = "Board" }

