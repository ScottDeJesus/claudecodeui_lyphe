<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinner — preview</title>

<body>
<div id="root" class="ast-stage"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { style: { minWidth: 200, display: 'grid', placeItems: 'center' } }, h(A.Spinner, { label: 'Reading the roadmap…' })),
    h('div', { style: { minWidth: 120, display: 'grid', placeItems: 'center' } }, h(A.Spinner, { size: 24 })),
    h('div', { style: { minWidth: 120, display: 'grid', placeItems: 'center' } }, h(A.Spinner, { size: 16 }))));
</script>
