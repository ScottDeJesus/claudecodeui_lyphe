<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap">
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  function useTicker(ms, n) { var s = React.useState(0); React.useEffect(function () { var id = setInterval(function () { s[1](function (v) { return (v + 1) % n; }); }, ms); return function () { clearInterval(id); }; }, []); return s[0]; }
  function Demo() {
    var t = useTicker(1200, 7), counts = [0, 1, 2, 3, 5, 3, 1];
    function Cell(p) { return h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, minWidth: 96 } }, h(A.Orbit, { count: p.n, size: p.size }), h('span', { className: 'telemetry', style: { color: 'var(--ink-muted)', textTransform: 'uppercase' } }, p.n + ' waiting')); }
    return h('div', { style: { display: 'flex', gap: 36, alignItems: 'center', padding: '24px 32px', flexWrap: 'wrap' } },
      h(Cell, { n: counts[t], size: 72 }), h(Cell, { n: 2, size: 48 }), h(Cell, { n: 11, size: 64 }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
