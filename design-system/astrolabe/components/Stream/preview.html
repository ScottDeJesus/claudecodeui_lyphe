<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap">
</head>
<body>
<div id="root" class="ast-stage-col"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  var WORDS = "The test races the mock clock: it awaits the upload before the timer is installed, so a fast runner finishes first. Install the timer before the upload starts.".split(' ');
  function Demo() {
    var s = React.useState(0), n = s[0];
    React.useEffect(function () { var id = setInterval(function () { s[1](function (v) { return v > WORDS.length + 14 ? 0 : v + 1; }); }, 110); return function () { clearInterval(id); }; }, []);
    var k = Math.min(n, WORDS.length);
    return h('div', { style: { maxWidth: 600 } }, h(A.Stream, { key: n === 0 ? 'r' + Math.random() : 'k', text: WORDS.slice(0, k).join(' '), live: k < WORDS.length }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
