<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextField — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap">
</head>
<body>
<div id="root" class="ast-stage"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  function Demo() {
    var s = React.useState('');
    return h(React.Fragment, null,
      h(A.TextField, { label: 'Line for the voice to speak', placeholder: 'Give it a line to speak…', onEnter: function (v) { s[1](v); }, style: { flex: '1 1 260px' } }),
      h(A.TextField, { label: 'Voice', showLabel: true, defaultValue: 'Samantha', style: { flex: '1 1 200px' } }),
      s[0] ? h(A.ReadoutRow, { items: [{ label: 'Sent', value: s[0] }] }) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
