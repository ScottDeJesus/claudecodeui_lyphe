<!-- @dsCard page group="Objects" height=660 width=1200 subtitle="The instrument at home: everything on its hoop" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap">
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  var CHATS = [
    { id: 'sched', label: 'Scheduling', detail: 'Working', state: 'working' },
    { id: 'uploads', label: 'Uploads', detail: 'Idle' },
    { id: 'pm', label: 'PM flow', detail: 'Idle' },
    { id: 'bugs', label: 'Bugfixes', detail: 'Idle' },
    { id: 'backend', label: 'Backend', detail: 'Idle' },
  ];
  var RUNS = [
    { id: 'scheduling', label: 'restorly-scheduling', detail: '14 / 26', progress: 14 / 26, state: 'working', steps: 26, agents: 2 },
    { id: 'sweeps', label: 'api-sweeps', detail: 'Done · 9 / 9', state: 'done', steps: 9 },
    { id: 'pmflow', label: 'pm-flow', detail: 'Waiting for your start', state: 'waiting', steps: 6 },
    { id: 'nightly', label: 'nightly-4', detail: 'Done · 212 checks', state: 'done', steps: 9 },
    { id: 'water', label: 'water-uploads', detail: 'Failed at 4 / 9', progress: 4 / 9, state: 'failed', steps: 9 },
    { id: 'arrival', label: 'arrival-physics', detail: 'Not started', steps: 12 },
  ];
  var ROAD = ['Accounts', 'Jobs and visits', 'Technician profiles', 'Scheduling', 'Uploads', 'PM flow', 'Billing', 'Reports', 'Release candidate'].map(function (l, i) {
    return { id: 'm' + (i + 1), label: l, detail: i < 3 ? 'Shipped' : i === 3 ? 'In progress' : 'Milestone ' + (i + 1), state: i < 3 ? 'done' : i === 3 ? 'working' : 'idle', progress: i === 3 ? 0.56 : 0 };
  });
  var STEP_NAMES = ['The account table', 'One writer for the lead flag', 'The sign-up sheet, fetched and read', 'Skills on the technician profile', 'Recommendations ranked by skill', 'The visit form picks from the ranking', 'Checks for the ranking', 'Notes for the scheduler', 'Release notes'];
  function stepsOf(run) {
    var n = run.steps || 9, done = Math.round((run.state === 'done' ? 1 : run.progress || 0) * n), out = [];
    for (var i = 0; i < n; i++) out.push({ id: i, label: STEP_NAMES[i % STEP_NAMES.length], state: i < done ? 'done' : i > done ? 'next' : run.state === 'working' ? 'live' : run.state === 'failed' ? 'failed' : run.state === 'waiting' ? 'waiting' : 'next' });
    return out;
  }
  var TONE = { working: ['Working', 'info'], waiting: ['Needs you', 'warn'], done: ['Done', 'positive'], failed: ['Failed', 'danger'] };
  function Detail(p) {
    var it = p.item, group = p.group;
    if (group.id === 'runs') return h(React.Fragment, null,
      h(A.Track, { steps: stepsOf(it), label: it.label }),
      h(A.KeyValueList, { items: [['Steps', it.detail], ['Route', 'Claude · round 3'], ['Helpers', it.agents ? String(it.agents) : '\u2014'], ['Spent', '2 h 24 m']] }),
      h('div', { style: { display: 'flex', gap: 8 } },
        it.state === 'waiting' || !it.state ? h(A.Button, { variant: 'primary', icon: 'play', onClick: function () { p.onStart(it); } }, 'Start')
          : it.state === 'working' ? h(React.Fragment, null, h(A.Button, null, 'Pause'), h(A.Button, null, 'Stop'))
          : it.state === 'failed' ? h(A.Button, { variant: 'primary', onClick: function () { p.onStart(it); } }, 'Retry') : null));
    if (group.id === 'chats') return it.state === 'waiting'
      ? h(A.Choice, { question: 'Water uploads: path A or B?', options: [{ value: 'a', label: 'Path A', detail: 'Resize on the phone' }, { value: 'b', label: 'Path B', detail: 'Resize on the server' }], likely: 'a', by: 'Kaylee', value: p.picked, words: p.picked ? 'path A' : undefined, via: 'spoken', at: '09:41', onPick: p.onPick })
      : h('p', { className: 'field-text', style: { color: 'var(--ink-quiet)' } }, it.state === 'working' ? 'Building the ranking for technician skills.' : 'Nothing running. Last touched yesterday.');
    return h(A.KeyValueList, { items: [['Milestone', it.id.slice(1) + ' / 9'], ['State', it.detail], ['Runs', it.state === 'working' ? '1 live' : '\u2014']] });
  }
  function Demo() {
    var hoop = React.useRef(null), o = React.useState(null), open = o[0], rs = React.useState(RUNS), runs = rs[0];
    /* the working runs count up, and come to rest when they are done */
    React.useEffect(function () {
      var id = setInterval(function () {
        rs[1](function (cur) { return cur.map(function (r) {
          if (r.state !== 'working') return r;
          var k = Math.min(r.steps, Math.round((r.progress || 0) * r.steps) + 1);
          return k >= r.steps ? Object.assign({}, r, { state: 'done', progress: 1, detail: 'Done · ' + r.steps + ' / ' + r.steps }) : Object.assign({}, r, { progress: k / r.steps, detail: k + ' / ' + r.steps });
        }); });
      }, 2600);
      return function () { clearInterval(id); };
    }, []);
    function start(it) { rs[1](function (cur) { return cur.map(function (r) { return r.id === it.id ? Object.assign({}, r, { state: 'working', progress: r.state === 'failed' ? r.progress : 0, detail: 'Started' }) : r; }); }); }
    var RUNS_OF = [{ id: 'chats', label: 'Chats', items: CHATS }, { id: 'runs', label: 'Runs', items: runs }, { id: 'road', label: 'Roadmap', items: ROAD }];
    var item = open ? (open.group.id === 'runs' ? runs.filter(function (r) { return r.id === open.id; })[0] : open.item) : null, t = item ? TONE[item.state] : null;
    return h('div', { style: { height: 660 } }, h(A.Scene, {
      instrument: h(A.Hoop, { ref: hoop, runs: RUNS_OF, defaultValue: 'pmflow', hold: !!open, label: 'Workspace', gauge: { value: 0.62, label: 'Context', detail: '124k of 200k' },
        onOpen: function (it, group) { o[1](function (cur) { return cur && cur.id === it.id ? null : { id: it.id, item: it, group: group }; }); } },
        h(A.Core, { state: 'idle', signal: 'demo' })),
      controls: h(A.Composer, { value: '', placeholder: 'To Kaylee · say it or type it', label: 'Message Kaylee', style: { flex: '1 1 320px', maxWidth: 440 } }),
      opening: h(A.Opening, { open: !!item, anchor: function () { return open && hoop.current ? hoop.current.pointOf(open.id) : null; }, onClose: function () { o[1](null); },
        source: open ? open.group.label : '', title: item ? item.label : '', status: t ? t[0] : undefined, tone: t ? t[1] : undefined },
        item ? h(Detail, { item: item, group: open.group, onStart: start }) : null),
    }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
