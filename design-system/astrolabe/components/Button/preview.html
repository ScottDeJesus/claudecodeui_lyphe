<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap">
</head>
<body>
<div id="root" class="ast-stage"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  function Demo() {
    var s = React.useState(false), on = s[0];
    return h(React.Fragment, null,
      h(A.Button, { variant: 'primary', icon: on ? 'stop' : 'play', active: on, onClick: function () { s[1](!on); } }, on ? 'Stop' : 'Speak'),
      h(A.Button, { variant: 'primary', icon: 'stop', active: true }, 'Stop'),
      h(A.Button, null, 'Clear'),
      h(A.Button, { variant: 'primary', icon: 'play', disabled: true }, 'Speak'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
