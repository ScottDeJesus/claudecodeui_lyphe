<div data-screen-label="Universe" style="position:fixed;inset:0;background:#101116;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:#f0f0f4;overflow:hidden;user-select:none">

    <div style="display:flex;gap:18px;font-size:14px;color:#a6a9b8;font-variant-numeric:tabular-nums">

      <span title="Lines of code" style="display:inline-flex;align-items:center;gap:7px"><span style="color:#7c7f8e;font-size:13px">≡</span>{{ statLines }}</span>
      <span title="Packages" style="display:inline-flex;align-items:center;gap:7px"><span style="color:#7c7f8e;font-size:11px">◈</span>{{ statPackages }}</span>

  <sc-if value="{{ showLog }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:24px;bottom:24px;width:360px;pointer-events:none;display:flex;flex-direction:column;gap:7px;padding:14px 16px;border-radius:12px;background:rgba(26,27,34,.82);border:1px solid #2a2b35">
      <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7c7f8e;margin-bottom:2px">Live traffic · {{ logCount }}</div>

          <span style="color:#7c7f8e;font-variant-numeric:tabular-nums;flex:none">{{ ev.hops }} hops</span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ hasSelection }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:16px;top:72px;width:min(320px,calc(100% - 32px));box-sizing:border-box;max-height:45%;overflow:auto;background:#1a1b22;border:1px solid #2a2b35;border-radius:12px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:uv-pop .5s cubic-bezier(.22,1,.36,1) both">

      </div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:28px;line-height:1.1;margin:8px 0 14px;text-wrap:pretty;overflow-wrap:anywhere">{{ selTitle }}</div>

      </div>
    </div>

</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;coreLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The project&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;nodeCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:800,&quot;min&quot;:80,&quot;max&quot;:1500,&quot;step&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Universe&quot;},&quot;gravity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.3,&quot;min&quot;:0.3,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Universe&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;hubs&quot;,&quot;options&quot;:[&quot;hubs&quot;,&quot;all&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;'hubs'|'all'|'none'&quot;,&quot;section&quot;:&quot;Universe&quot;},&quot;edges&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;imports&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;tree&quot;,&quot;imports&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;'all'|'tree'|'imports'|'none'&quot;,&quot;section&quot;:&quot;Universe&quot;},&quot;binaries&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Universe&quot;},&quot;milkyWay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Universe&quot;},&quot;orbit&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.05,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;inclination&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.7,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;precession&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.5,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;trails&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;flow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;traffic&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:0.5,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;/s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;trafficSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.2,&quot;min&quot;:0.1,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;drift&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;perspective&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.8,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Realism&quot;},&quot;depthOfField&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Realism&quot;},&quot;twinkle&quot;:{&quot;editor&quot;:   // gravity: stronger pull draws the packages in toward the core and tightens every family

  // Keplerian step: advance an offset vector along the node's own ellipse. Faster near periapsis, slower far out;

    const rc = Math.hypot(ux, uy) || 1, r = Math.hypot(dx, dy) || 1;

    const a = th * spd, c = Math.cos(a), s = Math.sin(a), vx = ux * c - uy * s, vy = (ux * s + uy * c) * n.ob;
    return [vx * n.oc - vy * n.os, vx * n.os + vy * n.oc];
  }

  // ---------- data ----------
  build() {
    const N = Math.max(60, Math.min(1500, Math.round(this.props.nodeCount ?? 640)));
    let seed = 1337; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const C = [

    const kindFor = (ci, u) => ci === 5 ? (u < .7 ? 'cfg' : u < .85 ? 'doc' : 'src') : ci === 6 ? (u < .55 ? 'src' : u < .8 ? 'cfg' : u < .9 ? 'test' : 'doc') : (u < .58 ? 'src' : u < .82 ? 'test' : u < .92 ? 'cfg' : 'doc');

    const hubs = C.map((c, i) => {
      const ang = -Math.PI / 2 + (i / C.length) * Math.PI * 2 + (rnd() - 0.5) * 0.7, R = 290 * LS;
      const h = mk({ kind: 'hub', label: c.name, x: Math.cos(ang) * 40, y: Math.sin(ang) * 40, tx: Math.cos(ang) * R, ty: Math.sin(ang) * R, ux: Math.cos(ang), uy: Math.sin(ang), rk: 0.7 + rnd() * 0.7, r: 9, cluster: i, bornAt: 520 + i * 110, depth: 1, lines: 0, used: 0 });

    const files = N - nodes.length, heavyBy = new Map();
    let totalLines = 0;
    for (let i = 0; i < files; i++) {
      const ci = Math.floor(rnd() * C.length), c = C[ci], h = hubs[ci];
      const myDirs = dirs.filter(d => d.cluster === ci);
      const parent = myDirs.length && rnd() < 0.78 ? pick(myDirs) : h;
      const kind = kindFor(ci, rnd());
      const stem = c.stems[h.used % c.stems.length] + (h.used >= c.stems.length ? Math.floor(h.used / c.stems.length) + 1 : '');
      h.used++;
      const label = stem + pick(ext[kind]);
      const lines = Math.round(kind === 'doc' ? 40 + rnd() * rnd() * 900 : kind === 'cfg' ? 12 + rnd() * rnd() * 300 : 30 + Math.pow(rnd(), 2.2) * 2600);

      }

      const wA = Math.min(1, daT) * (1 - 0.6 * blT), wS = dsT * (1 + 1.5 * blT) / Math.sqrt(z);
      for (let i = 3; i < pts.length; i += 3) {
        const k = pts[i + 2], k0 = pts[i - 1];
        ctx.globalAlpha = 0.16 * k * k * wA; ctx.lineWidth = (1 + 6 * k0) * wS;
        ctx.beginPath(); ctx.moveTo(pts[i - 3], pts[i - 2]); ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke();
        ctx.globalAlpha = 0.6 * Math.pow(k, 1.6) * wA; ctx.lineWidth = (0.3 + 1.4 * k0) * wS;
        ctx.beginPath(); ctx.moveTo(pts[i - 3], pts[i - 2]); ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke();
      }
      ctx.fillStyle = tr.col; const seed = (tr.seed || (tr.seed = Math.random() * 1000));
      for (let i = 6; i < pts.length; i += 6) { const k = pts[i + 2], j = Math.sin(seed + i * 1.7) * 5 * (1 - k), jy = Math.cos(seed * 1.3 + i * 2.1) * 5 * (1 - k); ctx.globalAlpha = 0.35 * k * wA; const ss = 0.8 * wS; ctx.fillRect(pts[i] + j - ss, pts[i + 1] + jy - ss, ss * 2, ss * 2); }
      ctx.globalAlpha = 0.9 * Math.min(1, daT) * (1 - 0.45 * blT); const hr = 9 * dsT * (1 + 2.2 * blT); ctx.drawImage(this.sprite(tr.col), hx - hr, hy - hr, hr * 2, hr * 2);
      ctx.globalAlpha = 0.95 * Math.min(1, daT) * (1 - 0.6 * blT); ctx.drawImage(this.sprite('#ffffff'), hx - hr * 0.35, hy - hr * 0.35, hr * 0.7, hr * 0.7);
    }
    // node cores — settled nodes batched per kind, the rest (spawning, dimmed, flashing) drawn individually
    ctx.globalCompositeOperation = 'source-over';
    const B = new Map(), bp = (k) => { let p = B.get(k); if (!p) B.set(k, p = new Path2D()); return p; };
    const dop = this.props.doppler ?? 0.6;
    for (const n of live) {
      if (!vis(n)) continue;
      const e = (now - n.bornAt) / 900, flashing = now - n.flashAt < 1100;
      const settled = e >= 1 && n.f > 0.98 && !flashing && n.occ < 0.05 && n.bl < 0.05 && n.kind !== 'core' && n.kind !== 'hub';
      const r = n.r * (e < 1 ? 1 + Math.sin(e * Math.PI) * 0.45 : 1) * (1 + 0.05 * Math.sin(now / 1100 + n.ph)) * n.ds * n.tk * (1 - 0.55 * n.bl);
      const col = dop && n.colB ? (n.vz * dop > 1 ? n.colB : n.vz * dop < -1 ? n.colR : n.col) : n.col;
      // depth alpha quantised to three bands so settled nodes still batch
      const ab = n.da > 0.9 ? '1' : n.da > 0.65 ? '0.78' : '0.55';
      if (settled) { const P = bp(n.kind + '|' + ab + '|' + col); P.moveTo(n.x + r, n.y); P.arc(n.x, n.y, r, 0, 6.283); if (n.kind === 'test') { const Q = bp('testIn|' + ab + '|' + col); Q.moveTo(n.x + r * .5, n.y); Q.arc(n.x, n.y, r * .5, 0, 6.283); } continue; }
      ctx.globalAlpha = Math.max(0.15, n.f) * ease(e) * Math.min(1, n.da) * (1 - 0.7 * n.bl);
      if (n.kind === 'doc') { ctx.fillStyle = col; ctx.globalAlpha *= 0.8; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.283); ctx.fill(); }
      else if (n.kind === 'test') { ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.283); ctx.stroke(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.5, 0, 6.283); ctx.fill(); }
      else if (n.kind === 'dir') { ctx.fillStyle = col; ctx.globalAlpha *= 0.9; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.283); ctx.fill(); }
      else { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.283); ctx.fill(); }
      const fe = (now - n.flashAt) / 1100;
      if (fe < 1) { ctx.globalAlpha = (1 - fe) * 0.7 * n.f; ctx.strokeStyle = col; ctx.lineWidth = 1 / Math.sqrt(z); ctx.beginPath(); ctx.arc(n.x, n.y, r + 2 + 30 * ease(fe), 0, 6.283); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    for (const [k, P] of B) {
      const [kind, ab, col] = k.split('|'); ctx.globalAlpha = +ab;
      if (kind === 'src' || kind === 'cfg' || kind === 'testIn') { ctx.fillStyle = col; ctx.fill(P); }
      else if (kind === 'test') { ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.stroke(P); }
      else if (kind === 'doc') { ctx.globalAlpha *= 0.8; ctx.fillStyle = col; ctx.fill(P); }
      else if (kind === 'dir') { ctx.globalAlpha *= 0.9; ctx.fillStyle = col; ctx.fill(P); }
    }
    if (sel) { ctx.globalAlpha = 0.9; ctx.strokeStyle = '#f0f0f4'; ctx.lineWidth = 1.2 / Math.sqrt(z); ctx.beginPath(); ctx.arc(sel.x, sel.y, sel.r + 5 + 2 * Math.sin(now / 400), 0, 6.283); ctx.stroke(); }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const mode = this.props.labels ?? 'hubs', far = Math.max(0, Math.min(1, (z - 0.2) / 0.25));
    if (mode !== 'none') for (const n of live) {
      if (!vis(n)) continue;
      const sx = (n.x - cam.x) * z + W / 2, sy = (n.y - cam.y) * z + H / 2;
      const a = ease((now - n.bornAt - 500) / 900);
      if (n.kind === 'core') { ctx.font = 'italic 22px "Instrument Serif", Georgia, serif'; ctx.fillStyle = '#f0f0f4'; ctx.globalAlpha = a * n.f * Math.max(far, z < 0.2 ? 1 : 0); ctx.fillText(n.label, sx, sy + n.r * z + 12); }
      else if (n.kind === 'hub') { if (far < 0.02) continue; ctx.font = '500 13px "Schibsted Grotesk", system-ui, sans-serif'; ctx.fillStyle = '#e4e5ec'; ctx.globalAlpha = a * Math.max(0.35, n.f) * far; ctx.fillText(n.label, sx, sy + n.r * z + 9); }
      else if (n.kind === 'dir') { if (z > 1.1 || n === sel || n === this.hover || (this.highlight && n.f > 0.85)) { ctx.font = '500 11.5px "Schibsted Grotesk", system-ui, sans-serif'; ctx.fillStyle = '#c8cad4'; ctx.globalAlpha = a * n.f; ctx.fillText(n.label, sx, sy + n.r * z + 6); } }
      else if (mode === 'all' || z > 1.7 || n === sel || n === this.hover || (this.highlight && n.f > 0.85)) { ctx.font = '400 11.5px "Schibsted Grotesk", system-ui, sans-serif'; ctx.fillStyle = '#c8cad4'; ctx.globalAlpha = a * n.f * (mode === 'all' || z > 1.7 ? Math.min(1, (z - 1.2)) || 1 : 1); ctx.fillText(n.label, sx, sy + n.r * z + 6); }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- template values ----------
  renderVals() {
    const s = this.state, G = this.G || { nodes: [], clusters: [] };
    const sel = s.sel != null ? G.nodes[s.sel] : null;
    const fmt = (n) => n.toLocaleString('en-US');
    let meta = '', cluster = '', linksLabel = 'Connected to';
    if (sel) {
      if (sel.kind === 'core') { meta = `${fmt(s.stats.files)} files · ${fmt(s.stats.lines)} lines`; cluster = 'Root of the graph'; linksLabel = 'Packages'; }
      else if (sel.kind === 'hub') { meta = `${fmt(G.nodes.filter(n => n.cluster === sel.cluster && this.isFile(n)).length)} files · ${fmt(sel.lines)} lines`; cluster = 'Package'; linksLabel = 'Contains'; }
      else if (sel.kind === 'dir') { meta = `${fmt(sel.adj.length - 1)} files · ${fmt(sel.lines)} lines`; cluster = G.clusters[sel.cluster].name; linksLabel = 'Contains'; }
      else { const fold = sel.parent.kind === 'dir' ? sel.parent : sel.parent.parent && sel.parent.parent.kind === 'dir' ? sel.parent.parent : null; meta = `${fmt(sel.lines)} lines · changed ${sel.age === 0 ? 'today' : sel.age === 1 ? 'yesterday' : sel.age + ' days ago'}` + (sel.partner ? ' · binary with ' + sel.partner.label : ''); cluster = G.clusters[sel.cluster].name + (fold ? '/' + fold.label : '/'); linksLabel = 'Folder & imports'; }
    }

      canvasRef: this.canvasRef,
      statFiles: fmt(s.stats.files), statLines: fmt(s.stats.lines), statPackages: s.stats.packages, statImports: fmt(s.stats.imports),
      hasSelection: !!sel,
      selTitle: sel ? sel.label : '', selCluster: cluster,
      selKind: sel ? this.KIND[sel.kind] : '', selTone: sel ? this.TONE[sel.kind] : 'neutral', selMark: sel ? this.MARK[sel.kind] : '',
      selMeta: meta, selDegree: sel ? sel.deg : 0, selLinksLabel: linksLabel,
      selLinks: sel ? sel.adj.slice(0, 9).map(n => ({ id: n.id, name: n.label, mark: this.MARK[n.kind], color: n.col, lines: this.isFile(n) ? fmt(n.lines) : '' })) : [],
      pickNeighbor: (e) => this.select(+e.currentTarget.dataset.id),
      closePanel: () => this.select(null),
      filterSrc: s.filter === 'src', filterTest: s.filter === 'test', filterCfg: s.filter === 'cfg', filterDoc: s.filter === 'doc',
      toggleSrc: () => this.setFilter('src'), toggleTest: () => this.setFilter('test'), toggleCfg: () => this.setFilter('cfg'), toggleDoc: () => this.setFilter('doc'),
      recenter: () => this.recenter(),
      wide: !s.narrow,
      showLog: !s.narrow && !sel && (s.log || []).length > 0, logCount: this.T ? this.T.length + ' in flight' : '',

      zoomIn: () => this.zoomBy(1.5), zoomOut: () => this.zoomBy(1 / 1.5), zoomLabel: s.zoomLabel ?? '100%',

  }
}
