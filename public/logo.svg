  <!-- Verve's accent, the CSS custom property `accent` in src/shared/ui/verve/tokens.css,
       spelled here as a literal because a static SVG served from /public has no stylesheet to
       read a custom property from. It is the ONE place in this app allowed to repeat a token's
       value; change it only with that token. Note for whoever edits this comment: XML forbids a
       double hyphen inside one, and Chromium rejects the whole document over it. -->
