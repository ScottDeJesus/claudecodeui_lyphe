# The regression suite: cases/<area>/<name><ext> are the scripts, cases/lib/ their shared helpers.
[suite]
name = "lyphecli"

[run]
timeout_s = 120
width = 4
build_max = 40
shared_max = 25

[run.commands]
".mjs" = ["node"]
".ts" = ["cloudcli-tsx"]

# Who imports whom (cases.users): each directory read -> the tsconfig its aliases come from.
[users]
[users.js]
"src" = "tsconfig.json"
"server" = "server/tsconfig.json"

[areas]
client = "the browser app's code with no screen (src/shared/), imported by a .ts case under node with the browser globals it reads stubbed"
server = "the API of the running server"
shell = "the app frame in a browser"
modules = "server code with no route, imported by a .ts case"
dispatcher = "the house dispatcher's card line that the board's cards ride on (~/.claude/hooks/dispatcher), run as child processes against a scratch store and a scratch cards.toml"
suites = "the kit's door as another suite on this box holds it (the EIS app's cases/lib/case.mjs), judged from outside that suite by scratch scripts run as child processes (lib/suite_helper.mjs)"
house = "the house's own Python (hooks/plan_runner, hooks/launch_table), run as a child process with the hooks importable by a .mjs case over scratch recipes, stores and transient user units (lib/house_live.mjs)"
souls = "the house's skills and soul shims a chat and every soul load (~/.claude/skills, ~/.claude/agents generated from ~/.claude/charters), read live and regenerated into a scratch folder by a .mjs case"
hunting = "the bug hunters' state as it stands on this box — the live dispatcher store's hunt rows and tickets with their sittings' launch logs, charters/hunts.toml, the crontab, the Schedules registry and the board, read only and never written"
walk = "the house's walk command (~/.claude/scripts/web-walk, hooks/web_walk/node/) and the app's own walk folder (walk/screens.toml, walk/app.mjs), run as a child process against the running dev app, every picture and report under the case's scratch folder"
rnd = "the live dispatcher store's R&D rows and the readings dispatcher rnd readings draws from them (~/.claude/hooks/dispatcher), run as a child process, read only and never written"
casestore = "the house's regression-case verbs (~/.claude/hooks/cases), read over a scratch dispatcher home holding a seeded suite, run as child processes (lib/cases_stats_house.mjs)"
supervisor = "the dev API's supervisor (deploy/dev-supervisor/) and its systemd unit: its modules imported by a .mjs case, the whole supervisor run as a child process over a stand-in server in a scratch repo (lib/dev_supervisor_rig.mjs), the loaded unit read through systemctl show"
warden = "the Cerberus warden's own code (warden/src) and the release a node runs (~/.cerberus-warden/current), imported by a .mjs case and run against a throwaway listener on 127.0.0.1 that the case starts and closes itself"
units = "the box's installed systemd unit files and keeper scripts as systemctl and the filesystem hold them (/etc/systemd/system, /usr/local/bin, /run), read only: nothing started, stopped or written"
docs = "what the repo's files, the house README (~/.claude/README.md) and the docstore rows say about the box, read with git grep and the docstore verbs, never written"
deploy = "the box's keeper scripts under deploy/ (deploy/heal), run as child processes with sudo and systemctl stood in for by lib/heal_stubs on PATH, against a scratch chain and a listener of the case's own (lib/heal_scripts.mjs)"
prodclient = "the production client's build: scripts/prod-client-build.sh, the tree watch it rides on (deploy/tree-watch/) and its build watcher (deploy/prod-client-watch/), imported by a .mjs case or run as child processes over a scratch repo with a stand-in build script (lib/prod_build_rig.mjs)"
